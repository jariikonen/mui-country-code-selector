# This workflow runs tests everytime a pull request is opened to main or updated.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

name: Test code in pull request

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm --filter mui-country-code-selector run ci-and-build
      - run: pnpm --filter mui-country-code-selector run test
